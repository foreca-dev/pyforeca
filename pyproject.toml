[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyforeca"
version = "0.1.0"
description = "Async Python client for the Foreca Weather API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Foreca Ltd", email = "support@foreca.com" }]
requires-python = ">=3.12"
dependencies = ["aiohttp>=3.9.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://developer.foreca.com"
Repository = "https://github.com/foreca-dev/pyforeca"
Documentation = "https://developer.foreca.com/documentation"

[tool.hatch.build.targets.wheel]
packages = ["src/pyforeca"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
strict = true
